# Frappe Helpdesk in one image: the Frappe core, telephony and this app on a
# bench, served by gunicorn. The image build runs `bench build --production`,
# which compiles the desk SPA, so it is the gate: a type error, a missing import
# or a broken component fails the image and nothing ships.
#
# amd64 only: the wkhtmltox package the Dockerfile installs is built for amd64.
images:
  - name: helpdesk
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/helpdesk
    platforms: [linux/amd64]
