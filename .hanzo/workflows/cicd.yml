# Canonical caller: every knob lives in /hanzo.yml. Builds on push to develop,
# this repo's default branch. No tag trigger: the upstream v* tags this fork
# carries are Frappe releases, not images of this repo.
name: CI/CD
on:
  push:
    branches: [develop]
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    secrets: inherit
